<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Ayham Bawaneh, IT support and network engineering">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b132b"/>
      <stop offset="0.55" stop-color="#1c2541"/>
      <stop offset="1" stop-color="#0f4c5c"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5bc0eb"/>
      <stop offset="1" stop-color="#9bf6c4"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1000" height="220" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1000" height="220" fill="url(#bg)"/>
    <g opacity="0.18" stroke="#5bc0eb" stroke-width="1">
      <path d="M0 40H1000M0 80H1000M0 120H1000M0 160H1000M0 200H1000"/>
      <path d="M100 0V220M200 0V220M300 0V220M400 0V220M500 0V220M600 0V220M700 0V220M800 0V220M900 0V220"/>
    </g>
    <path fill="#5bc0eb" fill-opacity="0.25" d="M0 170 C150 130 300 210 500 170 S850 130 1000 170 V220 H0Z">
      <animate attributeName="d" dur="7s" repeatCount="indefinite"
        values="M0 170 C150 130 300 210 500 170 S850 130 1000 170 V220 H0Z;
                M0 170 C150 205 300 135 500 170 S850 205 1000 170 V220 H0Z;
                M0 170 C150 130 300 210 500 170 S850 130 1000 170 V220 H0Z"/>
    </path>
    <path fill="#9bf6c4" fill-opacity="0.18" d="M0 190 C200 160 350 215 550 188 S850 165 1000 190 V220 H0Z">
      <animate attributeName="d" dur="9s" repeatCount="indefinite"
        values="M0 190 C200 160 350 215 550 188 S850 165 1000 190 V220 H0Z;
                M0 190 C200 214 350 165 550 190 S850 214 1000 190 V220 H0Z;
                M0 190 C200 160 350 215 550 188 S850 165 1000 190 V220 H0Z"/>
    </path>
    <g fill="#9bf6c4">
      <circle r="4"><animateMotion dur="5s" repeatCount="indefinite" path="M60 60 L300 60 L300 120 L620 120 L620 60 L940 60"/></circle>
      <circle r="4" fill="#5bc0eb"><animateMotion dur="6.5s" begin="1s" repeatCount="indefinite" path="M940 100 L700 100 L700 150 L380 150 L380 100 L60 100"/></circle>
    </g>
    <text x="500" y="98" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="url(#txt)" opacity="0">
      Ayham Bawaneh
      <animate attributeName="opacity" from="0" to="1" dur="1.6s" fill="freeze"/>
      <animate attributeName="y" from="118" to="98" dur="1.6s" fill="freeze"/>
    </text>
    <text x="500" y="140" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="20" fill="#e0e6f0" opacity="0">
      IT Support  |  Systems  |  Networking  |  Cloud
      <animate attributeName="opacity" from="0" to="0.95" begin="1.2s" dur="1.4s" fill="freeze"/>
    </text>
  </g>
</svg>
